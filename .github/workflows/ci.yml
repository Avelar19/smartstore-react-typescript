name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Uma nova execução na mesma branch/PR cancela a anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validação
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Yarn Classic 1.22.22 (Corepack, campo packageManager)
        run: |
          corepack enable
          yarn --version

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Testes unitários e de integração (Vitest)
        run: yarn test

      - name: Build de produção
        run: yarn build

      - name: Instalar Chromium do Playwright e dependências do sistema
        run: yarn playwright install --with-deps chromium

      - name: Testes E2E (Playwright, emulando o GitHub Pages)
        run: yarn test:e2e

      - name: Relatório do Playwright (somente em falha)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
